syntax = "proto3";

option go_package = "./;peer_api";
import "google/protobuf/empty.proto";

package peer_api;

// Add new message types for peer information
// "addr": "host:port",  (string) the ip address and port of the peer
	// "services": "00000001",  (string) the services supported by the peer
	// "lastrecv": n,  (numeric) time the last message was received in seconds since 1 Jan 1970 GMT
	// "lastsend": n,  (numeric) time the last message was sent in seconds since 1 Jan 1970 GMT
	// "bytessent": n,  (numeric) total bytes sent
	// "bytesrecv": n,  (numeric) total bytes received
	// "conntime": n,  (numeric) time the connection was made in seconds since 1 Jan 1970 GMT
	// "pingtime": n,  (numeric) number of microseconds the last ping took
	// "pingwait": n,  (numeric) number of microseconds a queued ping has been waiting for a response
	// "version": n,  (numeric) the protocol version of the peer
	// "subver": "useragent",  (string) the user agent of the peer
	// "inbound": true_or_false,  (boolean) whether or not the peer is an inbound connection
	// "startingheight": n,  (numeric) the latest block height the peer knew about when the connection was established
	// "currentheight": n,  (numeric) the latest block height the peer is known to have relayed since connected
	// "syncnode": true_or_false,  (boolean) whether or not t

message StreamInfo {
  uint32 stream_type = 1;
  uint64 bytes_sent = 2;
  uint64 bytes_recv = 3;
}

message Peer {
  int32 id = 1;
  string addr = 2;
  string addrLocal = 3;
  string services = 4;
  int64 lastSend = 5;
  int64 lastRecv = 6;
  int64 sendSize = 7;
  int64 recvSize = 8;
  int64 sendMemory = 9;
  bool pauseSend = 10;
  bool unpauseSend = 11;
  uint64 bytesSent = 12;
  uint64 bytesReceived = 13;
  int64 avgRecvBandwidth = 14;
  string assocId = 15;
  string streamPolicy = 16;
  bool inbound = 17;
  int64 connTime = 18;
  int64 pingTime = 19;
  int64 timeOffset = 20;
  uint32 version = 21;
  string subVer = 22;
  int32 startingHeight = 23;
  int32 currentHeight = 24;
  int32 banscore = 25;
  bool whitelisted = 26;
  int64 feeFilter = 27;
  repeated StreamInfo streams = 28;
  // ConnTime:       sp.ConnTime().Unix(),
	// 		PingTime:       sp.PingTime(),
	// 		TimeOffset:     sp.TimeOffset(),
	// 		Version:        sp.Version(),
	// 		SubVer:         sp.SubVer(),
	// 		StartingHeight: sp.StartingHeight(),
	// 		CurrentHeight:  sp.CurrentHeight(),
	// 		Banscore:       sp.Banscore(),
	// 		Whitelisted:    sp.Whitelisted(),
	// 		FeeFilter:      sp.FeeFilter
  }

	// 			"relaytxes":    true,
  //   "lastsend":     1727097288,
  //   "lastrecv":     1727097288,
  //   "sendsize":     0,
  //   "recvsize":     0,
  //   "sendmemory":   0,
  //   "pausesend":    false,
  //   "unpausesend":  false,
  //   "bytessent":    158838738,
  //   "bytesrecv":    17731391382,
  //   "avgrecvbw":    41,
  //   "associd":      "1f75f603-8fa2-4dbe-b68c-d686adbf5f8d",
  //   "streampolicy": "BlockPriority",

  message GetPeersResponse {
    repeated Peer peers = 1;
  }

  message GetPeerCountResponse {
    int32 count = 1;
  }

  message BanPeerRequest {
      string addr = 1;
      int64 until = 2;
  }

  message BanPeerResponse {
      bool ok = 1;
  }

  message UnbanPeerRequest {
      string addr = 1;
  }

  message UnbanPeerResponse {
      bool ok = 1;
  }

  message IsBannedRequest {
      string ipOrSubnet = 1;
  }

  message IsBannedResponse {
      bool isBanned = 1;
  }

  message ListBannedResponse {
      repeated string banned = 1;
  }

  message ClearBannedResponse {
      bool ok = 1;
  }

  // FetchHeadersFromPeerRequest requests block headers from a specific peer
  // using the Bitcoin wire protocol getheaders message.
  message FetchHeadersFromPeerRequest {
      // peer_addr is the "host:port" address of the connected legacy peer.
      string peer_addr = 1;
      // locator_hashes is the block locator (each entry is a 32-byte LE hash).
      repeated bytes locator_hashes = 2;
      // stop_hash is the hash where the peer should stop (32-byte LE).
      // All-zeros means return up to the chain tip.
      bytes stop_hash = 3;
  }

  // FetchHeadersFromPeerResponse returns the raw concatenated 80-byte block headers
  // received from the peer.
  message FetchHeadersFromPeerResponse {
      // header_bytes is a sequence of concatenated 80-byte block headers.
      bytes header_bytes = 1;
  }

  // FetchBlockFromPeerRequest requests a specific block from a peer via getdata.
  message FetchBlockFromPeerRequest {
      // peer_addr is the "host:port" address of the connected legacy peer.
      string peer_addr = 1;
      // block_hash is the 32-byte LE hash of the block to fetch.
      bytes block_hash = 2;
  }

  // FetchBlockFromPeerResponse returns the raw serialized block bytes.
  message FetchBlockFromPeerResponse {
      // block_bytes is the full serialized Bitcoin block.
      bytes block_bytes = 1;
  }

  // DelegateCatchupRequest asks the legacy service to sync from a specific
  // wire-protocol peer up to a target height. BlockValidation uses this to
  // delegate wire-protocol catchup to legacy while retaining peer selection
  // and retry decisions.
  message DelegateCatchupRequest {
      // peer_addr is the "host:port" of the already-connected wire peer.
      string peer_addr = 1;
      // target_height is the block height to sync up to.
      uint32 target_height = 2;
  }

  // CatchupProgress is streamed back to the caller during a delegated catchup.
  message CatchupProgress {
      enum Phase {
          DOWNLOADING_HEADERS = 0;
          DOWNLOADING_BLOCKS  = 1;
          COMPLETE            = 2;
          FAILED              = 3;
      }
      // phase indicates the current stage of the catchup operation.
      Phase  phase            = 1;
      // current_height is the height of the last successfully processed block.
      uint32 current_height   = 2;
      // target_height is the height we are syncing to.
      uint32 target_height    = 3;
      // blocks_remaining is how many blocks are left to process.
      int32  blocks_remaining = 4;
      // error_message is non-empty only when phase == FAILED.
      string error_message    = 5;
      // error_category classifies the failure: "network", "validation", "pruned", "peer_misbehavior".
      string error_category   = 6;
  }

  // Add new service for peer operations
  service PeerService {
    rpc GetPeers(google.protobuf.Empty) returns (GetPeersResponse) {}
    rpc BanPeer(BanPeerRequest) returns (BanPeerResponse) {}
    rpc UnbanPeer(UnbanPeerRequest) returns (UnbanPeerResponse) {}
    rpc IsBanned(IsBannedRequest) returns (IsBannedResponse) {}
    rpc ListBanned(google.protobuf.Empty) returns (ListBannedResponse) {}
    rpc ClearBanned(google.protobuf.Empty) returns (ClearBannedResponse) {}
    rpc GetPeerCount(google.protobuf.Empty) returns (GetPeerCountResponse) {}
    rpc FetchHeadersFromPeer(FetchHeadersFromPeerRequest) returns (FetchHeadersFromPeerResponse) {}
    rpc FetchBlockFromPeer(FetchBlockFromPeerRequest) returns (FetchBlockFromPeerResponse) {}
    // DelegateCatchup asks legacy to run wire-protocol catchup using the specified
    // peer up to the target height. Progress is streamed back; context cancellation aborts.
    rpc DelegateCatchup(DelegateCatchupRequest) returns (stream CatchupProgress) {}
  }
